name: metapos
description: "MetaPOS - Retail & Book Fair Flutter Mobile POS for Odoo 19"
publish_to: 'none'

version: 1.0.3+2004

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  intl: ^0.20.0
  uuid: ^4.5.1
  http: ^1.2.2
  dio: ^5.7.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^6.1.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
